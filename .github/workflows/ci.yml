name: CI

on:
  push:
    branches: [main, beta-developing]
  pull_request:
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.9", "3.12"]
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      # 测试只依赖 Pillow + numpy（GUI 的 PyQt6 不参与，避免拖慢 CI）
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install "Pillow>=10.4,<14" "numpy>=1.26,<3" pytest

      - name: Byte-compile all modules
        run: python -m compileall -q cli.py utils.py i18n.py gui.py slices

      - name: Run tests
        run: python -m pytest tests -q
